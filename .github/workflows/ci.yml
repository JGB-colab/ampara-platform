name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ampara
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: ampara
      DATABASE_URL: postgresql+psycopg://ampara:ci-only-password@db:5432/ampara
      AMAPARA_DEVICE_TOKEN: ci-only-device-token
      AMAPARA_ALLOWED_VEHICLE_ID: classic-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Run smoke test against PostgreSQL-backed API
        run: python scripts/smoke.py
      - name: Stop stack
        if: always()
        run: docker compose down -v
