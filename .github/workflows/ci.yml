name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint tools
        run: python -m pip install --retries 3 "ruff>=0.17,<1"
      - name: Lint Python files
        run: python -m ruff check .

  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --retries 3 -e ".[dev]"
      - name: Run unit and API tests with coverage
        env:
          COVERAGE_FILE: coverage.unit
        run: python -m pytest -m "not integration" --cov=ampara --cov-report=
      - name: Save unit test coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.unit
          if-no-files-found: error
          retention-days: 1

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ampara
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ampara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ampara -d ampara_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ampara:ci-only-password@localhost:5432/ampara_test
      AMAPARA_DEVICE_TOKEN: ci-only-device-token
      AMAPARA_ALLOWED_VEHICLE_ID: classic-demo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --retries 3 -e ".[dev]"
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Run PostgreSQL integration tests
        env:
          COVERAGE_FILE: coverage.integration
        run: python -m pytest -m integration --cov=ampara --cov-report=
      - name: Save integration test coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage.integration
          if-no-files-found: error
          retention-days: 1

  coverage:
    needs: integration-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ampara
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ampara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ampara -d ampara_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ampara:ci-only-password@localhost:5432/ampara_test
      AMAPARA_DEVICE_TOKEN: ci-only-device-token
      AMAPARA_ALLOWED_VEHICLE_ID: classic-demo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install coverage tooling
        run: python -m pip install --retries 3 -e ".[dev]"
      - name: Download unit coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage-data/unit
      - name: Download integration coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage-data/integration
      - name: Combine and report coverage
        run: |
          python -m coverage combine coverage-data/unit/coverage.unit coverage-data/integration/coverage.integration
          python -m coverage report --show-missing
          python -m coverage json -o coverage-current.json
      - name: Check out the base revision for a coverage baseline
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          path: baseline
          persist-credentials: false
      - name: Install base revision and coverage tooling
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: python -m pip install --retries 3 -e "baseline[dev]" "pytest-cov>=7,<8"
      - name: Apply base revision database migrations
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        working-directory: baseline
        run: alembic upgrade head
      - name: Run the base revision tests to measure baseline coverage
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        working-directory: baseline
        env:
          COVERAGE_FILE: baseline.coverage
        run: python -m pytest --cov=ampara --cov-report=
      - name: Report base revision coverage
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        working-directory: baseline
        run: python -m coverage json --data-file=baseline.coverage -o coverage-baseline.json
      - name: Fail if coverage fell below the base revision
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: >-
          python -c 'import json; current=json.load(open("coverage-current.json"))["totals"]["percent_covered"]; baseline=json.load(open("baseline/coverage-baseline.json"))["totals"]["percent_covered"]; print(f"Coverage: current={current:.2f}%, base={baseline:.2f}%"); raise SystemExit(current < baseline)'

  build-smoke:
    needs: coverage
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ampara
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: ampara
      AMAPARA_DEVICE_TOKEN: ci-only-device-token
      AMAPARA_ALLOWED_VEHICLE_ID: classic-demo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start the ephemeral Compose stack
        run: docker compose up -d --build
      - name: Run authenticated API smoke test
        run: python scripts/smoke.py
      - name: Stop stack and remove its ephemeral test volume
        if: always()
        run: docker compose down -v
